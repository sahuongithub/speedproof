[project]
name = "speedproof"
version = "0.1.0"
description = "Deterministic verification of code-performance improvements"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speedproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
